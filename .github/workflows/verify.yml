name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install-free static + runtime checks
        run: node scripts/verify.mjs

      - name: Syntax check the snapshot tool
        run: node --check scripts/snapshot.mjs

      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); if(p.license!=='MIT') throw new Error('license must be MIT'); console.log(p.name, p.version)"
